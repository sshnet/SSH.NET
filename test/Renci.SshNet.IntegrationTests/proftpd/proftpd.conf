ServerName "renci-ssh-tests-proftpd"
ServerType standalone
DefaultServer on
# SFTPEngine converts this server to SSH/SFTP entirely; no plain FTP is served.
Port 22
User nobody
Group nobody
DefaultRoot ~
AllowOverwrite on
PidFile /var/run/proftpd.pid
ScoreboardFile /var/run/proftpd.scoreboard

LoadModule mod_sftp.c

<IfModule mod_sftp.c>
  SFTPEngine on
  SFTPHostKey /etc/proftpd/host_rsa
  SFTPAuthMethods password
  SFTPLog /var/log/sftp.log
  # Re-key every 1 MB so that the key re-exchange races of
  # https://github.com/sshnet/SSH.NET/issues/1764 get many trials per upload.
  # Unlike OpenSSH, ProFTPD mod_sftp keeps sending channel messages
  # (SSH_MSG_CHANNEL_WINDOW_ADJUST / SSH_MSG_CHANNEL_DATA) after it has
  # initiated a re-exchange, which is what triggers the client-side failures.
  SFTPRekey required 3600 1
</IfModule>
